<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Close Combat · revisão de atlas</title>
<style>body{margin:0;background:#121217;color:#eee;font:15px system-ui}main{max-width:1240px;padding:26px;margin:auto}h1{font-size:30px}header{position:sticky;top:0;background:#121217ed;z-index:2;padding:8px 0 20px;border-bottom:1px solid #493540}select,button{font:inherit;background:#302630;color:#fff;border:1px solid #745565;border-radius:6px;padding:10px;margin-right:8px}p{color:#bcb0bc}section{padding:12px 0;border-bottom:1px solid #382c35}.frames{display:flex;gap:12px;overflow:auto}.frame{flex:0 0 220px;background:#1d1e25;border-radius:10px;overflow:hidden;text-align:center}.frame canvas{width:220px;height:260px;image-rendering:pixelated}.frame small{display:block;padding:10px;font-size:11px;color:#d3beca}code{color:#ff9ea5}a{color:#ff9ea5}</style>
<main><header><h1>Revisão dos atlas jogáveis</h1><p>Desenhos selecionados, pivôs e escalas do manifesto carregado pelo jogo.</p><select id="fighter" aria-label="Personagem"><option value="ayla">Ayla</option><option value="gris">Gris</option></select><select id="phase" aria-label="Fase"><option value="all">Sequências completas</option><option value="startup">Preparação</option><option value="active">Contato</option><option value="recovery">Recuperação</option></select><button id="flip">Espelhar</button> <a href="/">Abrir jogo</a><p id="summary"></p></header><div id="rows"></div></main>
<script type="module">
const $=id=>document.getElementById(id);let flip=false;
$('fighter').value=new URLSearchParams(location.search).get('fighter')==='gris'?'gris':'ayla';
async function show(){const id=$('fighter').value;const base=`/src/assets/sprites/characters/${id}/runtime/`;const [manifest,frames]=await Promise.all([fetch(`/src/assets/animations/${id}.json`).then(r=>r.json()),fetch(base+'frame-catalog.json').then(r=>r.json())]);const pictures=new Map();await Promise.all([...new Set(Object.values(frames).map(f=>f.sheet))].map(async sheet=>{const im=new Image();im.src=base+id+'-'+sheet+'.png';await im.decode();pictures.set(sheet,im)}));$('rows').replaceChildren();const phase=$('phase').value;const clips=manifest.clips.filter(c=>phase==='all'?!/-(startup|active|recovery)$/.test(c.key):c.key.endsWith('-'+phase));$('summary').textContent=`${id.toUpperCase()} · ${manifest.totalFrames} recortes selecionados · ${clips.length} sequências nesta vista`;
for(const clip of clips){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=clip.key;section.append(title);const strip=document.createElement('div');strip.className='frames';const indices=clip.frames??Array.from({length:clip.end-clip.start+1},(_,i)=>clip.start+i);for(const index of indices){const f=frames[index],r=f.sourceRect,canvas=document.createElement('canvas');canvas.width=440;canvas.height=520;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.scale(2,2);ctx.strokeStyle='#6b5362';ctx.beginPath();ctx.moveTo(10,242);ctx.lineTo(210,242);ctx.stroke();ctx.translate(110,242);ctx.scale(f.scale*(flip?-1:1),f.scale);ctx.drawImage(pictures.get(f.sheet),r.x,r.y,r.w,r.h,r.x-f.rootX,r.y-f.footY,r.w,r.h);const card=document.createElement('div');card.className='frame';const label=document.createElement('small');label.textContent=f.name;card.append(canvas,label);strip.append(card)}section.append(strip);$('rows').append(section)}}
$('fighter').onchange=()=>show().catch(error);$('phase').onchange=()=>show().catch(error);$('flip').onclick=()=>{flip=!flip;show().catch(error)};function error(e){$('summary').textContent='Não foi possível carregar o atlas: '+e.message}show().catch(error);
</script></html>
